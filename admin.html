<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Clasp &amp; Co admin</title>
<style>body{font:16px system-ui,sans-serif;background:#000;color:#efeae0;max-width:900px;margin:auto;padding:20px}input,button{font:inherit;padding:8px;background:#111;color:#efeae0;border:1px solid #444;border-radius:3px}button{cursor:pointer}table{width:100%;border-collapse:collapse;margin:10px 0 30px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid #2b2924;vertical-align:top}.ok{color:#8c8}.bad{color:#f88}h2{color:#c9a961}</style></head><body>
<h1>Clasp &amp; Co admin</h1>
<div id="login"><input id="pw" type="password" placeholder="Admin password"> <button id="go">Log in</button> <span id="err" class="bad"></span></div>
<div id="app" hidden><h2>Stock</h2><table id="stock"></table><h2>Orders (collect Fridays in the rotunda)</h2><table id="orders"></table></div>
<script>
let PW="";const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(body){const r=await fetch("/api/admin",{method:body?"POST":"GET",headers:{"x-admin-password":PW,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});if(r.status===401)throw new Error("Wrong password");return r.json()}
async function load(){const d=await api();const nm=Object.fromEntries(d.products.map(p=>[p.id,p.name]));
$("#stock").innerHTML="<tr><th>Item</th><th>Price</th><th>Left</th><th></th></tr>"+d.products.map(p=>`<tr><td>${esc(p.name)}</td><td>£<input type="number" min="0.30" step="0.01" value="${(p.price/100).toFixed(2)}" id="p-${p.id}" style="width:80px"></td><td><input type="number" min="0" value="${p.left}" id="s-${p.id}" style="width:70px"></td><td><button data-s="${p.id}">Save</button></td></tr>`).join("");
$("#orders").innerHTML="<tr><th>When</th><th>Who</th><th>Items</th><th>Status</th><th>Collected</th><th></th></tr>"+(d.orders.map(o=>`<tr><td>${new Date(o.at).toLocaleString("en-GB")}</td><td>${esc(o.name)}<br>${esc(o.email)}</td><td>${o.items.map(i=>i.q+" x "+esc(nm[i.id]||i.id)).join("<br>")}<br>£${(o.total/100).toFixed(2)}</td><td class="${o.status==="paid"?"ok":"bad"}">${esc(o.status)}</td><td><input type="checkbox" data-c="${esc(o.id)}" ${o.collected?"checked":""}></td><td><button data-d="${esc(o.id)}">Delete</button></td></tr>`).join("")||"<tr><td colspan=6>No orders yet.</td></tr>")}
$("#go").onclick=async()=>{PW=$("#pw").value;try{await load();$("#login").hidden=true;$("#app").hidden=false}catch(e){$("#err").textContent=e.message}};
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.s){const pr=Number($("#p-"+b.dataset.s).value);if(!(pr>=0.30&&pr<=1000)){alert("Price must be between £0.30 and £1000.");return}await api({action:"price",id:b.dataset.s,price:pr});await api({action:"stock",id:b.dataset.s,left:$("#s-"+b.dataset.s).value});b.textContent="Saved";setTimeout(()=>b.textContent="Save",900)}
if(b.dataset.d&&confirm("Delete this order record? (This does not refund anyone.)")){await api({action:"delete",id:b.dataset.d});load()}});
document.addEventListener("change",async e=>{const c=e.target.closest("input[data-c]");if(c)await api({action:"collected",id:c.dataset.c,value:c.checked})});
</script></body></html>
